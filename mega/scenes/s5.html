<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сцена 5</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../kit/vendor/fonts.css"><link rel="stylesheet" href="../kit/stage.css">
</head><body>
<div id="root" data-duration="19.94">
  <div id="camera"><div id="float"><div id="shake"><div id="world"></div></div></div></div>
  <div id="overlay"></div>
</div>
<script src="../kit/vendor/gsap.min.js"></script>
<script src="../kit/lines.js"></script>
<script src="../kit/rig.js"></script>
<script src="../kit/sfx.js"></script>
<script src="../kit/stage.js"></script>
<script>
const N = 5;
const { tl, T } = Stage.init({ scene: N });
const B = T.beats, DUR = T.duration;
const bg = Stage.bg.zone();
Stage.addLayer('front', 1, 'fx');
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (html, parent) => {
  if (!parent) { const g = document.createElementNS(NS, 'g'); g.innerHTML = html; return g; }
  const v = document.createElementNS(NS, 'svg'); v.setAttribute('width', 1); v.setAttribute('height', 1); v.style.overflow = 'visible'; v.style.position = 'absolute'; v.style.left = '0'; v.style.top = '0'; v.innerHTML = html; parent.appendChild(v); return v; };
const L = (id) => T.lines.find((l) => l.id === id);
[bg.door.slab, bg.door.light].forEach((e) => { e.style.position = 'absolute'; });
Stage.camSet({ x: 1030, y: 960, scale: 0.9 });

/* ---------- передний план: земля, обломки (нижняя треть не пустая) ---------- */
svgEl(`<path d="M300,1290 q40,-30 80,0 t80,0 t80,0" stroke="#2b1a12" stroke-width="5" fill="none"/>
  <g fill="#3d2112" stroke="#2b1a12" stroke-width="4"><path d="M700,1420 l60,-26 l40,24 l-16,30 l-70,6z"/><path d="M1500,1400 l50,-22 l44,20 l-10,28 l-66,4z"/><path d="M2000,1450 l60,-24 l36,26 l-20,26 l-66,0z"/></g>
  <g fill="#b8a468" stroke="#2b1a12" stroke-width="5"><path d="M1000,1500 q-8,-40 40,-44 q48,4 40,44z"/><path d="M1850,1470 q-6,-34 34,-38 q40,4 34,38z"/></g>
  <g stroke="#2b1a12" stroke-width="5" fill="#e0d6b0"><rect x="900" y="1380" width="44" height="14" rx="3" transform="rotate(-14 900 1380)"/><rect x="1300" y="1450" width="44" height="14" rx="3" transform="rotate(10 1300 1450)"/></g>`, Stage.layers.mid);

/* ---------- враги на холме: тёмные силуэты ---------- */
const enemyHTML = `<ellipse cx="0" cy="2" rx="46" ry="8" fill="#000" opacity=".25"/>
  <g class="bd"><path d="M-34,0 V-70 Q-34,-104 0,-106 Q34,-104 34,-70 V0Z" fill="#1d130d"/>
  <g class="hd"><circle cx="0" cy="-132" r="27" fill="#1d130d"/><path d="M-32,-136 Q0,-178 32,-136 L40,-128 H-40Z" fill="#150d09"/></g>
  <g class="rf"><path d="M-70,-64 L70,-92" stroke="#150d09" stroke-width="12" stroke-linecap="round"/><path d="M-40,-70 l-8,30" stroke="#150d09" stroke-width="10" stroke-linecap="round"/><path d="M20,-84 l6,26" stroke="#150d09" stroke-width="9" stroke-linecap="round"/></g></g>`;
const enemies = [[480, 1000, 1.0, 1], [575, 1008, 0.9, -1], [680, 1050, 1.05, 1]].map(([x, y, s, f]) => {
  const e = svgEl(enemyHTML, Stage.layers.mid); gsap.set(e, { x, y, scaleX: s * f, scaleY: s, opacity: 0.88 });
  return { e, hd: e.querySelector('.hd'), rf: e.querySelector('.rf'), bd: e.querySelector('.bd'), f, s, x }; });
const shake = (en, t, k) => { // тряска автомата: пустой магазин
  tl.to(en.rf, { rotation: -8 * k, duration: 0.07, ease: 'power2.out', svgOrigin: '0 -64' }, t)
    .to(en.rf, { rotation: 7 * k, duration: 0.08, ease: 'power2.inOut', svgOrigin: '0 -64' }, t + 0.07)
    .to(en.rf, { rotation: -4 * k, duration: 0.08, ease: 'power2.inOut', svgOrigin: '0 -64' }, t + 0.15)
    .to(en.rf, { rotation: 0, duration: 0.2, ease: 'sine.out', svgOrigin: '0 -64' }, t + 0.23);
  tl.to(en.bd, { y: -5, duration: 0.07, ease: 'power2.out' }, t).to(en.bd, { y: 0, duration: 0.25, ease: 'bounce.out' }, t + 0.07); };
const glance = (en, t, a) => tl.to(en.hd, { rotation: a, x: a * 0.3, duration: 0.3, ease: 'sine.inOut', svgOrigin: '0 -112' }, t);
[[1.15, 0, 1], [1.5, 1, 1], [2.0, 2, 1.1], [2.2, 0, 1.2], [2.52, 1, 1]].forEach(([t, i, k]) => shake(enemies[i], t, k));
glance(enemies[0], 1.7, 14); glance(enemies[1], 1.8, -14); glance(enemies[2], 1.9, -16);
glance(enemies[0], 2.6, -10); glance(enemies[1], 2.7, 12); glance(enemies[2], 3.0, 10);
glance(enemies[0], 4.4, 6); glance(enemies[1], 5.0, -6);
enemies.forEach((en, i) => tl.to(en.e, { y: '+=3', duration: 1.5 + i * 0.3, ease: 'sine.inOut', yoyo: true, repeat: 8 }, i * 0.4));

/* ---------- колючая проволока: помятый круг ---------- */
const SX = [600, 795, 995, 1195, 1390];       // чайка, ладошка, устав, хохотун, гвоздь
const ring = Stage.prop.wire({ d: 1000, x: 995, y: 1222, s: 1, rot: -2 });
const ring2 = Stage.prop.wire({ d: 800, x: 1020, y: 1240, s: 1, rot: 4 });
const scrap = SX.slice(0, 4).map((x, i) => Stage.prop.wire({ d: 170 + i * 10, x: x + (i - 1.5) * 6, y: 1214, s: 1, rot: (i % 2 ? 6 : -7) }));

/* ---------- персонажи ---------- */
const mkc = (name, o) => { const c = Rig.create(name, o); Stage.layers.actors.appendChild(c.el); return c; };
const ST = { chk: 522, lad: 745, ustav: 905, hoh: 1101, gvz: 1456 };
const chk = mkc('chaika', { x: ST.chk || SX[0], y: 1190, scale: 0.6, facing: 0 });
const lad = mkc('ladoshka', { x: ST.lad || SX[1], y: 1205, scale: 0.62, facing: 0.3 });
const ustav = mkc('ustav', { x: ST.ustav || SX[2], y: 1238, scale: 0.68, facing: 0 });
const hoh = mkc('hohotun', { x: ST.hoh || SX[3], y: 1205, scale: 0.62, facing: 0 });
const gvz = mkc('gvozd', { x: ST.gvz || SX[4], y: 1190, scale: 0.6, facing: -0.3 });
const all = [chk, lad, ustav, hoh, gvz]; window.__r = { chk, lad, ustav, hoh, gvz };
hoh.set({ mouth: 4 });

// на кадре 0 все уже лежат: клип падения «зажат» на последнем сэмпле
const lie = (c, o) => c.fall(tl, 0, Object.assign({ timeScale: 0.02 }, o));
lie(chk, { style: 'back', dir: -1, seed: 3 });
lie(lad, { style: 'knees', dir: -1, seed: 5 });
lie(ustav, { style: 'sit', dir: -1, seed: 7 });
lie(hoh, { style: 'face', dir: -1, seed: 9 });
lie(gvz, { style: 'knees', dir: 1, seed: 11 });
gsap.set(Stage.el.black, { opacity: 1 }); tl.set(Stage.el.black, { opacity: 0 }, 0.05);   // склейка из чёрного прячет первые кадры падения
hoh.pose(tl, 1.1, 'cheerWeak', 0.4);

/* подъём: у каждого свой момент */
const GU = { chk: 1.95, lad: 1.5, ustav: 2.25, hoh: 1.75, gvz: 2.45 }, GD = 1.7;
const upEnd = {};
[['chk', chk], ['lad', lad], ['ustav', ustav], ['hoh', hoh], ['gvz', gvz]].forEach(([k, c]) => {
  c.getUp(tl, GU[k], GD); upEnd[k] = GU[k] + GD + 0.2; });
all.forEach((c, i) => {
  const k = ['chk', 'lad', 'ustav', 'hoh', 'gvz'][i];
  c.idle(tl, upEnd[k], i === 4 ? 13.55 : DUR); c.blinks(tl, upEnd[k] + 0.1, i === 4 ? 13.55 : DUR); });

/* Устав с блокнотом */
ustav.prop(tl, upEnd.ustav - 0.1, 'R', 'notebook');
ustav.pose(tl, upEnd.ustav, 'hold', 0.5);
ustav.look(tl, upEnd.ustav, 0.1, 0.7, 0.5);
[chk, lad, hoh, gvz].forEach((c, i) => c.look(tl, upEnd.chk + 0.2 + i * 0.1, [-0.4, 0.3, -0.5, -0.3][i], 0.4, 0.6));
chk.pose(tl, upEnd.chk + 0.1, 'stand', 0.5); lad.pose(tl, upEnd.lad + 0.1, 'stand', 0.5); hoh.pose(tl, upEnd.hoh + 0.1, 'stand', 0.5); hoh.mouth(tl, upEnd.hoh + 0.15, 4);
gvz.pose(tl, upEnd.gvz + 0.1, 'stand', 0.5);

/* ===== victory: Хохотун хлопает один раз ===== */
const T_CLAP = 4.0 - 0.0;
hoh.pose(tl, 4.2, 'rubHands', 0.4);
hoh.pose(tl, 4.7, 'stand', 0.4);
Stage.punch(tl, 4.6, 0.012);

/* ===== L32 Устав ===== */
{ const l = L(32); ustav.talk(tl, l.t, l.dur, { energy: 0.9, gesture: false }); }
/* ===== L33 Хохотун считает пальцы ===== */
{
  const l = L(33);
  hoh.talk(tl, l.t, l.dur, { energy: 1.0, gesture: false });
  hoh.pose(tl, l.t - 0.15, 'handOut', 0.4);
  hoh.pose(tl, l.t + 0.5, 'point', 0.3); hoh.pose(tl, l.t + 0.85, 'handOut', 0.3);
  hoh.pose(tl, l.t + 1.2, 'point', 0.3);
  hoh.look(tl, l.t, -0.8, 0.2, 0.3); hoh.look(tl, l.t + 0.5, -0.3, 0.2, 0.3); hoh.look(tl, l.t + 0.9, 0.4, 0.2, 0.3); hoh.look(tl, l.t + 1.3, 0.8, 0.2, 0.3);
  hoh.mouth(tl, l.t + l.dur + 0.04, 4);
  ustav.look(tl, l.t + 0.1, 0.5, 0.6, 0.4);
  hoh.pose(tl, l.t + l.dur + 0.1, 'stand', 0.5);
}
/* ===== пауза и L34 ===== */
{
  const l = L(34);
  ustav.look(tl, B.pause.t + 0.1, 0.05, 0.8, 0.9);
  ustav.prop(tl, l.t - 0.1, 'R', 'notebook', false);
  ustav.pose(tl, l.t - 0.1, 'stand', 1.0);
  ustav.talk(tl, l.t, l.dur, { energy: 0.6, gesture: false });
  [chk, lad, hoh, gvz].forEach((c, i) => c.look(tl, B.pause.t + 0.05 + i * 0.1, [0.4, 0.3, -0.5, -0.5][i], 0.35, 0.8));
}
/* ===== terminal: рука Ладошки ===== */
const armFront = svgEl(`<g class="arm">
  <path d="M-420,-170 L-20,-30" stroke="#2b1a12" stroke-width="62" stroke-linecap="round" fill="none"/>
  <path d="M-420,-170 L-20,-30" stroke="#6b7340" stroke-width="46" stroke-linecap="round" fill="none"/>
  <path d="M-70,-52 L-52,2" stroke="#2b1a12" stroke-width="14" stroke-linecap="round"/>
  <g transform="translate(70 40)">
    <ellipse cx="0" cy="4" rx="62" ry="8" fill="#000" opacity=".22"/>
    <path d="M-62,0 L-56,-135 Q-54,-146 -43,-146 H43 Q54,-146 56,-135 L62,0Z" fill="#2a2f2a" stroke="#2b1a12" stroke-width="6"/>
    <rect x="-46" y="-134" width="92" height="64" rx="8" fill="#0d2a12" stroke="#2b1a12" stroke-width="4"/>
    <rect x="-40" y="-128" width="80" height="52" rx="5" fill="#58d36b"/>
    <text x="0" y="-100" text-anchor="middle" font-family="Russo One" font-size="26" fill="#0d2a12">46 ×</text>
    <text x="0" y="-82" text-anchor="middle" font-family="Russo One" font-size="12.5" fill="#0d2a12">ОЖИВЛЕНИЕ</text>
    ${[0, 1, 2].map((i) => `<rect x="${-38 + i * 26}" y="-58" width="22" height="22" rx="5" fill="${i === 2 ? '#58d36b' : '#d8d8c8'}" stroke="#2b1a12" stroke-width="3"/>`).join('')}
    ${[0, 1, 2].map((i) => `<rect x="${-38 + i * 26}" y="-30" width="22" height="20" rx="5" fill="${i === 0 ? '#e23b2e' : '#d8d8c8'}" stroke="#2b1a12" stroke-width="3"/>`).join('')}
  </g>
  <circle cx="-8" cy="14" r="30" fill="#f2c9a0" stroke="#2b1a12" stroke-width="6"/>
  <path d="M-30,-6 q12,-10 24,-4 M-34,8 q14,-8 28,-2" stroke="#2b1a12" stroke-width="5" fill="none" stroke-linecap="round"/>
</g>`, Stage.layers.front);
const termNode = armFront.querySelector('.arm');
gsap.set(armFront, { x: 750, y: 1170, scale: 1.6, opacity: 0 });
{
  const t0 = B.terminal.t;
  gsap.set(termNode, { x: -330 });
  tl.set(armFront, { opacity: 1 }, t0);
  tl.to(termNode, { x: 0, duration: 0.9, ease: 'power3.out' }, t0);
  lad.look(tl, t0 + 0.1, 0.8, 0.1, 0.4);
  ustav.look(tl, t0 + 0.55, -0.7, 0.35, 0.45);        // Устав переводит взгляд на терминал
  tl.to(termNode, { y: -10, duration: 0.2, ease: 'power2.out' }, t0 + 0.9).to(termNode, { y: 0, duration: 0.5, ease: 'elastic.out(1,0.5)' }, t0 + 1.1);
  const l = L(35);
  lad.talk(tl, l.t, l.dur, { energy: 1.0, gesture: false });
  lad.look(tl, l.t - 0.1, 0.8, 0.05, 0.3);
  tl.to(termNode, { x: -330, duration: 0.7, ease: 'power2.in' }, l.t + l.dur + 0.5);
  tl.set(armFront, { opacity: 0 }, l.t + l.dur + 1.25);
  chk.look(tl, t0 + 0.8, 0.6, 0.2, 0.4);
}

/* ===== shed: Гвоздь идёт к сараю, дверь захлопывается ===== */
const frontDoor = Stage.door({ x: bg.door.x, y: bg.door.y, w: bg.door.w, h: bg.door.h, kind: 'wood', layer: 'front' });
frontDoor.el.children[0].style.display = 'none'; frontDoor.el.children[1].style.display = 'none';
const T_OPEN = 15.3, T_SLAM = B.black.t - 0.28;   // створка бьёт на 0,12 с раньше чёрного: сплющенный Гвоздь виден ~4 кадра
{
  const t0 = B.shed.t;
  gvz.pose(tl, t0 - 0.05, 'cheerWeak', 0.3);
  gvz.pose(tl, t0 + 0.1, 'stand', 0.3);
  gvz.look(tl, t0 + 0.1, 0.9, 0, 0.3);
  const e = gvz.walkTo(tl, t0 + 0.0, 2300, 1.6, { face: 0.85 });
  [chk, lad, ustav, hoh].forEach((c, i) => c.look(tl, t0 + 0.35 + i * 0.3, 0.9, 0.05, 0.9));
  [chk, lad, ustav, hoh].forEach((c, i) => c.turn(tl, t0 + 0.45 + i * 0.3, 0.6, 1.1));
  gvz.idle(tl, e + 0.05, DUR);
  gvz.pose(tl, e - 0.05, 'handOut', 0.35);
  bg.door.open(tl, T_OPEN, { dur: 0.5 });
  tl.to(frontDoor.slab, { rotationY: -84, duration: 0.5, ease: 'power3.inOut' }, T_OPEN);
  bg.door.slam(tl, T_SLAM, { shake: 24 });
  tl.to(frontDoor.slab, { rotationY: 0, duration: 0.16, ease: 'power4.in' }, T_SLAM);
  tl.set(frontDoor.slab, { opacity: 0 }, T_SLAM + 0.17);
  gvz.squash(tl, T_SLAM + 0.14, { axis: 'x', to: 0.2, hold: 0.5 });
  Stage.punch(tl, T_SLAM + 0.16, 0.05);
  Stage.debris(tl, T_SLAM + 0.16, 2300, 1180, { n: 8, power: 0.7 });
  Stage.dust(tl, T_SLAM + 0.16, 2300, 1190, { n: 6, size: 50, spread: 130 });
}
/* чёрный на ударе */
Stage.blackout(tl, B.black.t - 0.01, 0.02);   // на хрусте

/* ---------- дым: только за персонажами; у земли оседает пыль ---------- */
[[560, 1180], [820, 1190], [1100, 1190], [1380, 1180], [1620, 1170]].forEach(([x, y], i) =>
  Stage.smoke(tl, 0, 10.5, x, y, { n: 3, size: 150, rise: 520, alpha: 0.2, life: 3.4 + i * 0.2, drift: 30 - i * 15, layer: 'far2' }));
Stage.smoke(tl, 10.5, 16.1, 1000, 1190, { n: 3, size: 140, rise: 480, alpha: 0.18, life: 3.6, drift: 30, layer: 'far2' });
[[640, 0.05], [900, 0.3], [1180, 0.15], [1420, 0.5], [780, 0.9], [1050, 1.2]].forEach(([x, t]) => Stage.dust(tl, t, x, 1250, { n: 2, size: 34, spread: 70 }));
Stage.confetti(tl, B.victory.t + 0.35, 1110, 560, { n: 30, w: 700, ang: [250, 290] });

/* ---------- титры ---------- */
Stage.tag(tl, 0.3, 'ЗОНА', 2.2);
Stage.title(tl, B.victory.t, 'ПОБЕДА', { y: 470, dur: 2.7, size: 190 });
Stage.captions(tl, T.lines);

// эндкард на чёрном
const E0 = B.endcard.t;
Stage.title(tl, E0, 'ОТРЯД МЕГА', { y: 560, size: 150, sub: 'потери в пределах нормы' });
const cnt = Stage.counter(tl, E0 + 0.25, { label: 'ПОТЕРИ', value: 47, x: 540, y: 1010 });
cnt.set(tl, E0 + 0.85, 48);
const wrap = document.createElement('div'); wrap.style.cssText = 'position:absolute;left:0;top:0;'; Stage.el.titles.appendChild(wrap); wrap.appendChild(cnt.el);
gsap.set(wrap, { x: -270, y: -535, scale: 1.5, transformOrigin: '0px 0px' });   // счётчик ≈ 480 px шириной, центр (540, 980)
const helm = svgEl(`<ellipse cx="0" cy="6" rx="46" ry="7" fill="#000" opacity=".3"/><path d="M-44,0 C-44,-54 44,-54 44,0 Q0,9 -44,0Z" fill="#6b7340" stroke="#2b1a12" stroke-width="5"/><path d="M-44,0 Q0,9 44,0 Q0,1 -44,0Z" fill="#4f5a2e" stroke="#2b1a12" stroke-width="4"/><path d="M-22,-34 Q0,-44 22,-34" stroke="#8a9a5a" stroke-width="5" fill="none" opacity=".7"/>`, Stage.el.titles);
gsap.set(helm, { x: 240, y: 1900, rotation: -50, opacity: 1, scale: 2.2 });
tl.to(helm, { y: 1255, duration: 1.0, ease: 'power2.out' }, E0 + 0.2);
tl.to(helm, { x: 700, duration: 1.15, ease: 'power3.out' }, E0 + 0.2);
tl.to(helm, { rotation: 40, duration: 0.55, ease: 'sine.inOut' }, E0 + 0.2).to(helm, { rotation: -10, duration: 0.4, ease: 'sine.inOut' }, E0 + 0.75)
  .to(helm, { rotation: 14, duration: 0.25, ease: 'sine.inOut' }, E0 + 1.15).to(helm, { rotation: -9, duration: 0.25, ease: 'sine.inOut' }, E0 + 1.4)
  .to(helm, { rotation: 5, duration: 0.22, ease: 'sine.inOut' }, E0 + 1.65).to(helm, { rotation: 0, duration: 0.3, ease: 'sine.out' }, E0 + 1.87);
tl.to(helm, { y: 1235, duration: 0.1, ease: 'power2.out' }, E0 + 1.05).to(helm, { y: 1255, duration: 0.12, ease: 'power2.in' }, E0 + 1.15);
// всё плавно гаснет к последнему кадру
tl.to(Stage.el.titles, { opacity: 0, duration: 0.6, ease: 'sine.inOut' }, DUR - 0.65);

/* ---------- камера ---------- */
const cam = (t, x, y, s, d, e) => Stage.cam(tl, t, { x, y, scale: s }, d, e || 'sine.inOut');
cam(0.0, 1000, 960, 0.95, 0.1);
cam(0.3, 1000, 950, 0.97, 2.4, 'sine.inOut');
cam(2.7, 995, 930, 1.0, 1.3);
cam(4.0, 995, 880, 1.4, 0.9, 'power2.inOut');           // L32 на Уставе
cam(6.3, 1100, 900, 1.2, 0.7, 'power2.inOut');          // L33 Хохотун считает
cam(8.3, 995, 900, 1.12, 0.6, 'sine.inOut');            // пауза: общий, тишина
cam(8.95, 995, 830, 1.5, 0.5, 'sine.inOut');            // L34: медленный наезд на лицо
cam(9.4, 1000, 830, 1.95, 1.0, 'sine.inOut');
cam(10.45, 890, 1010, 1.5, 0.8, 'sine.inOut');          // терминал и L35: Ладошка + терминал + Устав
cam(13.0, 1100, 960, 0.8, 0.8, 'sine.inOut');           // общий: все провожают Гвоздя
cam(14.6, 1900, 940, 1.0, 1.0, 'sine.inOut');
cam(15.5, 2200, 920, 1.2, 0.5, 'sine.inOut');
cam(15.98, 2260, 900, 1.45, 0.22, 'power3.in');

/* ---------- звук ---------- */
window.__sound = (ctx, t0) => {
  const s = SFX.init(ctx, t0, { partStart: T.partStart, room: 'field' });
  s.ambience('aftermath', 0, DUR);
  s.duckLines(T.lines);
  s.shot(0.2, { dist: 'far', pan: -0.5 }); s.shot(0.75, { dist: 'far', pan: 0.3, gain: 0.8 });
  [[1.15, -0.6], [1.5, 0.3], [2.0, -0.2], [2.2, -0.6], [2.52, 0.2]].forEach(([t, p]) => s.emptyClick(t, { pan: p }));
  [GU.lad, GU.hoh, GU.chk, GU.ustav, GU.gvz].forEach((t, i) => s.cloth(t + 0.1, { pan: -0.4 + i * 0.2 }));
  [GU.lad, GU.hoh, GU.chk, GU.ustav, GU.gvz].forEach((t, i) => s.dustPuff(t + 0.3, { pan: -0.4 + i * 0.2 }));
  s.music('fanfareSad', B.victory.t);
  s.noise(4.2 + 0.4, { n: 'w', fl: [{ t: 'bandpass', f: 2400, q: 0.8 }], a: 0.5, tau: 0.03, dur: 0.14, g: 0.5, pan: 0.2 });
  s.music('tender', 5.6, B.pause.t, { fadeOut: 0.25, gain: 0.6 });   // перед «Я знаю» музыка обрывается
  s.terminalBeep(B.terminal.t + 0.35, { pan: -0.2 });
  s.cloth(B.terminal.t - 0.1, { pan: -0.3 });
  s.footsteps(B.shed.t + 0.2, B.shed.t + 1.6, { surface: 'dirt', rate: 2.6 });
  s.whoosh(T_OPEN, 0.45, { panTo: 0.5 });
  s.doorSlam(T_SLAM + 0.16, { pan: 0.4 }); s.crunch(B.black.t, { pan: 0.4 });
  s.sting(E0 + 0.2, { variant: 1, gain: 0.5 });
  s.thud(E0 + 1.1, { gain: 0.5, pan: 0.1 }); s.thud(E0 + 1.4, { gain: 0.25, pan: 0.15 });
  s.coin(E0 + 1.3, { gain: 0.5 });
  s.fadeOut(DUR - 0.8, 0.8);
};
