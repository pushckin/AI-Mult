<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Риг — демонстрация</title>
<style>
  html,body{margin:0;background:#111;}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(#f6d58a 0%,#e9a54a 46%,#b96a2c 70%);font-family:sans-serif}
  #hills{position:absolute;left:0;top:0}
  #scene{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #label{position:absolute;left:40px;top:250px;font:900 44px/1.1 sans-serif;color:#fff;-webkit-text-stroke:8px #1a0f08;paint-order:stroke fill;letter-spacing:1px}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(43,26,18,.45) 100%);pointer-events:none}
</style></head>
<body>
<div id="root" data-duration="22">
  <svg id="hills" width="1080" height="1920" viewBox="0 0 1080 1920">
    <circle cx="800" cy="640" r="150" fill="#fbe7b0" opacity=".8"/>
    <path d="M0,1010 Q270,820 560,960 T1080,900 V1920 H0 Z" fill="#8a4a24"/>
    <path id="ground" d="M0,1120 Q540,1080 1080,1120 V1920 H0 Z" fill="#5a3018"/>
  </svg>
  <div id="scene"></div>
  <div id="label"></div>
  <div id="vig"></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="rig.js"></script>
<script>
var CY = {rubHands:1, write:1, eat:1, wave:1};
(function(){
  var q = new URLSearchParams(location.search), mode = q.get('mode') || 'demo';
  var scene = document.getElementById('scene'), label = document.getElementById('label'), root = document.getElementById('root');
  var tl = gsap.timeline({paused:true}), chars = window.__chars = {};
  function mk(name, o){ o.parent = scene; return chars[name] = Rig.create(name, o); }
  var labels = [];
  // подпись — функция времени (без состояния): ставится при каждом кадре
  function syncLabel(){ var t = tl.time(), s = ''; for (var i=0;i<labels.length;i++) if (labels[i][0] <= t) s = labels[i][1]; if (label.textContent !== s) label.textContent = s; }
  tl.eventCallback('onUpdate', syncLabel);
  var dur = 22;

  if (mode === 'fall') {            // крупно: одно падение + подъём
    var who = q.get('who') || 'ustav', style = q.get('style') || 'knees', dir = +(q.get('dir') || 1);
    var c = mk(who, {x: dir > 0 ? 330 : 750, y: 1300, scale: 1});
    var T = Rig.fallInfo(style).total;
    c.idle(tl, 0, 0.5);
    c.fall(tl, 0.5, {style: style, dir: dir});
    c.getUp(tl, 0.5 + T + 0.3, 2.4);
    c.idle(tl, 0.5 + T + 2.9, 0.5 + T + 4);
    labels.push([0, style + ' · ' + who]);
    dur = 0.5 + T + 4;
  } else if (mode === 'poses') {    // лист поз
    var who2 = q.get('who') || 'ustav', c2 = mk(who2, {x: 540, y: 1300, scale: 1}), t = 0.2;
    Rig.poses.filter(function(p){return p !== 'cheerWeak';}).forEach(function(p){ c2.pose(tl, t, p, CY[p] ? 1.3 : 0.45); labels.push([t, p]); t += 1.5; });
    c2.pose(tl, t, 'stand', 0.4); t += 0.6;
    labels.push([t,'look']); c2.look(tl, t, 1, 0, 0.3); c2.look(tl, t+0.5, -1, -0.5, 0.3); c2.look(tl, t+1, 0, 0, 0.3); t += 1.5;
    labels.push([t,'turn / flinch']); c2.turn(tl, t, 1); c2.turn(tl, t+0.6, -1); c2.turn(tl, t+1.2, 0); c2.flinch(tl, t+1.9); t += 3;
    labels.push([t,'jump / bounce']); c2.jump(tl, t, 140); c2.bounce(tl, t+1.2, 36); t += 2;
    labels.push([t,'squash']); c2.squash(tl, t, {axis:'y', hold:0.5}); c2.squash(tl, t+2.2, {axis:'x', hold:0.4}); t += 4.4;
    labels.push([t,'talk']); c2.talk(tl, t, 2, {energy:1.2}); t += 2.3;
    dur = t;
  } else if (mode === 'walk') {
    var who3 = q.get('who') || 'gvozd', c3 = mk(who3, {x: 150, y: 1300, scale: 1});
    c3.walkTo(tl, 0.3, 900, 3.2); c3.turn(tl, 3.7, 0); c3.walkTo(tl, 4.4, 300, 2.6, {face:0});
    c3.idle(tl, 7.1, 8);
    dur = 8;
  } else {                          // общая демонстрация ~22 с
    var Y = 1180, S = 0.6;
    var u = mk('ustav', {x:150, y:Y, scale:S}), ch = mk('chaika', {x:400, y:Y, scale:S}), la = mk('ladoshka', {x:650, y:Y, scale:S}), ho = mk('hohotun', {x:900, y:Y, scale:S});
    var gv = mk('gvozd', {x:-170, y:1500, scale:0.72});
    [u, ch, la, ho].forEach(function(c){ c.idle(tl, 0, 7.6); c.blinks(tl, 0, 7.6); });
    gv.blinks(tl, 0, 12);
    labels.push([0,'стоят · дышат · моргают']);
    labels.push([0.6,'говорит']);       u.pose(tl, 0.5, 'point', 0.5); u.talk(tl, 0.9, 2.2, {energy:1, hand:'L'}); u.pose(tl, 3.3, 'stand', 0.5);
    ch.look(tl, 0.8, -1, 0, 0.35); la.look(tl, 1.0, -1, 0, 0.35); ho.look(tl, 1.3, -1, 0.1, 0.35);
    labels.push([3.4,'идёт']);          gv.walkTo(tl, 1.2, 560, 3.9, {face:0});
    ch.look(tl, 3.6, 0.4, 0.7, 0.3); la.look(tl, 3.8, -0.3, 0.8, 0.3); ho.look(tl, 3.5, -0.9, 0.7, 0.3);
    labels.push([5.2,'позы']);
    gv.pose(tl, 5.3, 'think', 0.5); gv.idle(tl, 5.9, 12.6);
    ch.pose(tl, 5.4, 'handOut', 0.5); la.pose(tl, 5.5, 'rubHands', 1.8); ho.pose(tl, 5.6, 'wave', 1.6); u.pose(tl, 5.7, 'write', 1.6);
    ho.talk(tl, 5.8, 1.2, {energy:1.3, gesture:false});
    [ch, la, ho].forEach(function(c){ c.look(tl, 6.9, 0, 0, 0.3); });
    ch.pose(tl, 7.3, 'stand', 0.4); gv.pose(tl, 7.3, 'stand', 0.4);
    labels.push([8,'падение: knees']);  u.fall(tl, 8.0, {style:'knees', dir:1});
    labels.push([9.2,'падение: back']); ch.fall(tl, 9.2, {style:'back', dir:1});
    labels.push([10.4,'падение: face']); la.fall(tl, 10.4, {style:'face', dir:-1});
    labels.push([11.6,'падение: spin']); ho.fall(tl, 11.6, {style:'spin', dir:-1});
    labels.push([12.8,'падение: sit']); gv.fall(tl, 12.8, {style:'sit', dir:1});
    labels.push([14.0,'getUp']);        u.getUp(tl, 14.0, 2.2); u.idle(tl, 16.3, 16.9);
    labels.push([17.0,'падение: blast']); u.fall(tl, 17.0, {style:'blast', dir:1});
    gv.pose(tl, 16.4, 'cheerWeak', 1.6); gv.mouth(tl, 16.9, 3); gv.mouth(tl, 17.3, 0);
    labels.push([18.3,'getUp — все']);
    ch.getUp(tl, 18.3, 2.3); la.getUp(tl, 18.5, 2.5); ho.getUp(tl, 18.7, 2.3); gv.getUp(tl, 18.9, 2.6);
    [ch, la, ho, gv].forEach(function(c, i){ c.blinks(tl, 21.2, 22); });
    dur = 22;
  }
  root.dataset.duration = dur;
  tl.to({}, {duration: 0.01, ease:'power1.out'}, dur - 0.01);
  window.__timelines = { main: tl };
  tl.seek(0, false); syncLabel();
  if (q.get('play')) tl.play();
})();
</script>
</body></html>
