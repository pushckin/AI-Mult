<body><svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script src="engine.js"></script>
<script src="kit.js"></script>
<script>
window.READY = (async () => {
  await Promise.all([document.fonts.load('40px Neucha', 'Привет мир'), document.fonts.load('40px Neucha', 'Hello GTA VI $3.79'), document.fonts.load('40px Neucha', '→—«»…%№')]);
  await document.fonts.ready;
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'assets/logo.png'; });
  const load = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { console.error('LOADFAIL ' + src); res(); }; document.body.appendChild(s); });
  await load('voice_timings.js'); // может отсутствовать — тогда номинальные тайминги
  await load('timing.js');
  await load('scenes/common.js'); // общие персонажи (скелет, консольщик) — может отсутствовать
  for (let i = 1; i <= 7; i++) await load(`scenes/s${i}.js`);
  await load('brand.js');
  return true;
})();
</script></body></html>
