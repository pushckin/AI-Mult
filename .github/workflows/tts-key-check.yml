name: ElevenLabs Sound Effects check

on:
  push:
    branches: ['codex/tts-key-check-manual*']

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a short sound effect
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          status=$(curl -sS --max-time 60 -o response -w '%{http_code} %{content_type}' \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"text":"A single soft cartoon pop","duration_seconds":1}' \
            'https://api.elevenlabs.io/v1/sound-generation')
          echo "ElevenLabs — $status"
          if [[ "$status" != "200 audio/"* || ! -s response ]]; then
            jq -r '.detail.status? // .detail.type? // empty' response 2>/dev/null || true
            exit 1
          fi
          echo "ElevenLabs — audio received"
