name: TTS key check
on:
  push:
    branches: ['codex/tts-key-check-manual']

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for model in gemini-3.8-flash-tts gemini-2.5-flash-preview-tts; do
            status=$(curl -sS --max-time 60 -o gemini.json -w '%{http_code}' \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{"contents":[{"parts":[{"text":"Hello."}]}],"generationConfig":{"responseModalities":["AUDIO"],"speechConfig":{"voiceConfig":{"prebuiltVoiceConfig":{"voiceName":"Puck"}}}}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
            echo "$model — HTTP $status"
            if [ "$status" = 200 ]; then
              jq -e 'any(.candidates[]?.content.parts[]?; (.inlineData.data // "") != "")' gemini.json >/dev/null
              echo "Gemini TTS — audio received"
              exit 0
            fi
            [ "$status" = 404 ] || exit 1
          done
          exit 1

            - name: ElevenLabs Sound Effects
        if: ${{ !cancelled() }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          status=$(curl -sS --max-time 60 -o elevenlabs-response -w '%{http_code} %{content_type}' \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Accept: audio/mpeg' \
            -d '{"text":"A single soft cartoon pop","duration_seconds":1}' \
            'https://api.elevenlabs.io/v1/sound-generation')
          echo "ElevenLabs Sound Effects — $status"
          if [[ "$status" != "200 audio/"* || ! -s elevenlabs-response ]]; then
            jq -r '(.detail.status? // .detail.type? // empty) | strings | select(test("^[a-zA-Z0-9_-]{1,80}$"))' elevenlabs-response 2>/dev/null || true
            exit 1
          fi
          echo "ElevenLabs Sound Effects — audio received"
